plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mytasks.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.zamenki.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // Фиксированный ключ подписи: каждая новая сборка ставится поверх старой, данные не теряются.
    signingConfigs {
        debug {
            storeFile file('zamenki.jks')
            storePassword 'zamenki123'
            keyAlias 'zamenki'
            keyPassword 'zamenki123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
